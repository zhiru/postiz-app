# Insert after the existing RewriteEngine On, before general proxy rewrite rules.
# The exact route must run before the Hermes deployment RewriteMap catch-all.
RewriteRule "^/webhooks/instagram$" "http://127.0.0.1:15038/webhooks/instagram" [P,L]
# Keep this before ProxyPass "/" to define the relay worker and its timeouts.
ProxyPassMatch "^/webhooks/instagram$" "http://127.0.0.1:15038/webhooks/instagram" connectiontimeout=3 timeout=15 retry=0
