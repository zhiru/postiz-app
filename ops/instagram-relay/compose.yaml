services:
  relay:
    image: python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
    container_name: postiz-instagram-relay
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      META_APP_SECRET_FILE: /run/secrets/meta_app_secret
      RELAY_INSTAGRAM_IDS: ${RELAY_INSTAGRAM_IDS:?Set the authorized connected Instagram account IDs}
    volumes:
      - ./relay.py:/app/relay.py:ro
      - ./spool:/data
    secrets:
      - meta_app_secret
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    command: [python, /app/relay.py]
    healthcheck:
      test: [CMD, python, -c, "import http.client; c=http.client.HTTPConnection('127.0.0.1',15038,timeout=2); c.request('GET','/health'); r=c.getresponse(); raise SystemExit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
secrets:
  meta_app_secret:
    file: ${META_APP_SECRET_FILE:?Set the private file containing the current Meta app secret}
